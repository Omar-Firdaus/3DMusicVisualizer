<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixer</title>
    <link rel="stylesheet" href="intro.css" />
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <header class="topBar">
        <p class="topBarText">CORSINCANA - made by Omar Firdaus</p>
    </header>

    <main class="indexPage">
        <div class="visualStage" id="visualStage">
            <canvas id="oceanCanvas" aria-hidden="true"></canvas>
            <canvas id="wormholeCanvas" aria-hidden="true"></canvas>
        </div>
    </main>

    <section class="mixerPanel" id="mixerPanel" aria-label="Track mixer">
        <div class="mixerBar">
            <button id="mixerToggle" class="mixerToggle" type="button" aria-expanded="false">
                Mixer Controls
            </button>
            <button id="transportPlay" class="transportPlay" type="button" aria-pressed="false">
                Play
            </button>
        </div>

        <div class="transportStrip">
            <div class="transportTimes">
                <span id="transportElapsed">0:00</span>
                <span class="transportDivider">/</span>
                <span id="transportDuration">0:00</span>
            </div>
            <input
                id="transportSeek"
                class="transportSeek"
                type="range"
                min="0"
                max="1000"
                value="0"
                step="1"
                disabled
            />
        </div>

        <div class="mixerContent">
            <div class="trackGrid" id="trackGrid"></div>
        </div>
    </section>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="visual.js"></script>
    <script src="index.js"></script>
</body>
</html>
