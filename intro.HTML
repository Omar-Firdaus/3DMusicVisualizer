<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Music Visualizer</title>
    <link rel="stylesheet" href="intro.css" />
</head>
<body>
    <div class="page">
    <canvas id="canvas"></canvas>
    <form class="emailField" id="emailField" novalidate>
        <input
            id="emailInput"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            spellcheck="false"
        />
        <button id="nameButton" type="submit">Start Now</button>
    </form>
    <p class="creditLine">Designed and produced by Omar Firdaus</p>
    </div>
    <script src="intro.js"></script>
</body>
</html>
